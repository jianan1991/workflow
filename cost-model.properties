# Phase 1 — the cost model.
#
# Unit costs are DERIVED here, not typed in: tokens x price, per agent. That way a price
# change or a model swap is a one-line edit and every downstream figure moves with it.
#
#   unit cost = (input tokens / 1M x input price) + (output tokens / 1M x output price)
#
# Run it:  java -cp orchestrator/target/classes com.loop.orchestrator.cost.CostWorksheet \
#               --tier1 4 --tier2 2 --ui --model cost-model.properties

# =========================================================================== prices
# Anthropic first-party API rates, $ per million tokens. Cached 2026-06-24 — check
# before quoting: https://www.anthropic.com/pricing
#
# Bedrock and Vertex are partner-operated and priced separately. Microsoft Foundry
# bills at these same rates.

model.claude-opus-5.input=5.00
model.claude-opus-5.output=25.00

model.claude-sonnet-5.input=2.00
model.claude-sonnet-5.output=10.00

model.claude-haiku-4-5.input=1.00
model.claude-haiku-4-5.output=5.00

# Available if an agent needs the most capable model. Twice Opus 5 per token — nothing
# in this pipeline currently justifies it.
model.claude-fable-5-1.input=10.00
model.claude-fable-5-1.output=50.00

# ============================================================================ tiers
# Maps the tier names in litellm/config.yaml to actual models. Change a tier here and
# every agent on it moves.
#
# To pin ONE agent to a specific model, give it `agent.<name>.model` instead — a direct
# model wins over its tier. Use that for the agent carrying most of the bill rather than
# inventing a tier of one:
#
#   agent.dev-t2.model=claude-sonnet-5

tier.strong=claude-opus-5
tier.mid=claude-sonnet-5
tier.cheap=claude-haiku-4-5

# The reviewer is SUPPOSED to be a different model family from whichever agent wrote the
# code, because a model tends to bless work from its own family. Every tier above is
# Anthropic, so that mitigation is currently weakened — see the note in PHASES.md phase 9.
# Point this at a non-Anthropic model through LiteLLM if you want the real thing.
tier.review=claude-sonnet-5

# =========================================================================== agents
# Token estimates per run. These are the numbers to argue about — the prices are facts,
# these are assumptions.
#
# Measure them properly with the token counting endpoint on ONE REAL PROMPT per agent,
# carrying the context it would actually receive. An architect prompt with twenty
# retrieved chunks and a call graph is nothing like the example on a pricing page.
#
# OUTPUT TOKENS INCLUDE THINKING. Adaptive thinking is on by default on Opus 5 and
# thinking tokens bill as output, so an agent doing real reasoning costs far more on the
# output side than its visible answer suggests. Do not estimate output from the length of
# the reply you expect to see.

agent.pm.tier=strong
agent.pm.input-tokens=8000
agent.pm.output-tokens=2000

agent.ba.tier=strong
agent.ba.input-tokens=6000
agent.ba.output-tokens=1500

agent.architect.tier=strong
agent.architect.input-tokens=15000
agent.architect.output-tokens=3000

agent.designer.tier=strong
agent.designer.input-tokens=10000
agent.designer.output-tokens=4000

# Coding agents run a multi-turn loop — twenty or more API calls with the context growing
# each time. The input figure is the whole loop, not one call, which is why it dwarfs
# everything else here.
agent.dev-t1.tier=cheap
agent.dev-t1.input-tokens=150000
agent.dev-t1.output-tokens=15000

agent.dev-t2.tier=strong
agent.dev-t2.input-tokens=400000
agent.dev-t2.output-tokens=40000

agent.reviewer.tier=review
agent.reviewer.input-tokens=20000
agent.reviewer.output-tokens=2000

agent.qa.tier=mid
agent.qa.input-tokens=25000
agent.qa.output-tokens=3000

# ========================================================================== caching
# Prompt caching can cut repeated input substantially — the system prompt, tool
# definitions and retrieved context are identical across every turn of a dev agent loop,
# which is where most of the input tokens above live.
#
# Left at 1.0 (no discount) deliberately: quoting a saving nobody has measured is how an
# estimate stops being defensible. Set this per agent once you can read
# usage.cache_read_input_tokens from real runs.
cache-discount=1.0

# ======================================================================= multiplier
# Expected trips round the rework loop, applied to build and check stages only.
# Planning agents run once per epic however badly the build goes.
#
# A guess until 20 real stories have run. Recalibrate monthly from the last 20 — it
# drifts whenever the pipeline improves or degrades, which is exactly when someone
# quotes it at you.
rework-multiplier=1.45

# ==================================================================== human minutes
# The expensive currency. At a loaded engineer rate these cost several times the model
# spend, and they do not fall as the pipeline gets better at coding.
#
# Time them with a stopwatch on three real reviews. Recalled review time is reliably
# under-reported.
gate-1-minutes=12
gate-2-minutes=15
gate-3-minutes-per-story=8
question-minutes=18
manual-verification-minutes=22
ui-extra-manual-minutes=25
