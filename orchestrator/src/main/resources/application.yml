server:
  port: 8081

spring:
  application:
    name: loop-orchestrator
  jackson:
    default-property-inclusion: non_null

temporal:
  target: ${TEMPORAL_TARGET:127.0.0.1:7233}
  namespace: ${TEMPORAL_NAMESPACE:default}

llm:
  # scripted = no key, no network, no cost. Runs the whole pipeline end to end and proves
  #            the plumbing: prompt assembly, parsing, error paths, cost accounting.
  #            It proves NOTHING about whether an agent's answers are any good.
  # litellm  = real model calls, real money.
  #
  # Scripted is the default deliberately. Defaulting to the real provider means a test run
  # either fails to start or quietly spends money.
  provider: ${LLM_PROVIDER:scripted}

  base-url: ${LITELLM_BASE_URL:http://localhost:4000}
  api-key: ${LITELLM_MASTER_KEY:sk-loop-local-dev}
  max-output-tokens: 4096

cost:
  # One file prices the agents and maps them to tiers, so an agent can never be callable
  # but unpriced, or priced but uncallable.
  model-file: ${COST_MODEL_FILE:../cost-model.properties}

dev:
  # The dev agent is the only one that is not a single model call - it is a multi-turn
  # coding loop, so it sits behind a harness rather than behind ChatModel.
  #
  # scripted  = writes no code. Everything downstream still runs.
  # openhands = dispatches to OpenHands headless. It WILL edit the workspace.
  provider: ${DEV_PROVIDER:scripted}

  executable: ${DEV_EXECUTABLE:openhands}

  # The checkout the agent works in. Required when provider is openhands - without it the
  # harness starts in whatever directory this process happens to be in.
  workspace: ${DEV_WORKSPACE:}

  # Must stay below the 30 minute activity timeout in StoryWorkflowImpl, or Temporal gives
  # up on a run that is still going and retries it on a half-edited workspace.
  timeout-minutes: ${DEV_TIMEOUT_MINUTES:20}

# The three steps between an agent's branch and a pull request a person can read.
# All default to off. Each one refuses to start if switched on without what it needs,
# because the expensive failure here is a pipeline that looks like it is working.
scm:
  # scripted = reads no repository. The reviewer is told there is no diff.
  # git      = real `git diff base...branch` in dev.workspace.
  provider: ${SCM_PROVIDER:scripted}
  executable: ${SCM_EXECUTABLE:git}

  # What a branch is compared against, and what pull requests are opened against.
  base-branch: ${SCM_BASE_BRANCH:main}

ci:
  # scripted = no build, nothing measured, nothing can auto-approve.
  # maven    = runs the repository's own build and measures the diff.
  provider: ${CI_PROVIDER:scripted}

  # On Windows this must be mvn.cmd. ProcessBuilder does not apply PATHEXT the way a shell
  # does, so a bare `mvn` is reported as "could not start" rather than found.
  executable: ${CI_EXECUTABLE:mvn}

  # Where the Maven project sits inside the workspace. A repository whose build is not at
  # the git root - like this one - needs it.
  module: ${CI_MODULE:.}

  # Must stay under the 30 minute activity timeout in StoryWorkflowImpl. Startup refuses
  # otherwise, rather than letting Temporal abandon a build that is still running.
  timeout-minutes: ${CI_TIMEOUT_MINUTES:25}

  # The gates, applied here rather than by the build, and measured against the diff rather
  # than the repository. A project-wide rule on a codebase that is mostly stubs fails for
  # reasons nobody can act on, which is how teams learn to pass -DskipTests.
  diff-coverage-threshold: ${CI_DIFF_COVERAGE:0.90}
  mutation-threshold: ${CI_MUTATION:0.70}

pr:
  # scripted = opens nothing, logs the description it would have written.
  # github   = opens a real pull request that other people can see.
  provider: ${PR_PROVIDER:scripted}
  api-base-url: ${PR_API_BASE_URL:https://api.github.com}

  # owner/name
  repository: ${PR_REPOSITORY:}

  # A fine-grained token scoped to that one repository, pull-request write only. The only
  # credential here that can change anything outside this process.
  token: ${PR_TOKEN:}

qdrant:
  url: ${QDRANT_URL:http://localhost:6333}
  collection: knowledge

knowledge:
  path: ${KNOWLEDGE_PATH:../knowledge-base}

  # hashing = offline, no key, lexical only. Proves the plumbing.
  # litellm  = real embeddings. Required before judging retrieval quality.
  embedder: ${KNOWLEDGE_EMBEDDER:hashing}
  embedding-model: ${EMBEDDING_MODEL:text-embedding-3-small}

  # Must match the embedder. Changing it means dropping the collection and reindexing —
  # Qdrant refuses a mismatch, which is the least confusing way for this to fail.
  dimensions: ${KNOWLEDGE_DIMENSIONS:256}

  # qdrant = the real store. memory = nothing survives a restart, useful for a smoke run.
  store: ${KNOWLEDGE_STORE:qdrant}

  # Below this cosine score a hit is noise and the agent must ask a person instead.
  # Re-measure it on your own notes; the right value is a property of your corpus.
  relevance-floor: 0.25

  # Reformulations an agent may try before it has to raise a question.
  max-search-attempts: 3

logging:
  level:
    com.loop.orchestrator: DEBUG
    io.temporal: INFO
